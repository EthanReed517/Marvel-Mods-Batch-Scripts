;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; Optimizer configuration generated by sgFinalizer
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;


; Global settings

[OPTIMIZE]

optimizationCount = 3

hierarchyCheck = true


; Note: igGeometryAttr1_5 and igGeometryAttr2 both seem to work


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; igConvertGeometryAttr
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[OPTIMIZATION1]

name = igConvertGeometryAttr

accessMode = 3

storeBoundingVolume = false


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; igResizeImage
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[OPTIMIZATION2]

name = igResizeImage

widthFactor = -1

heightFactor = -1

minHeight = 1

minWidth = 1

maxHeight = 512

maxWidth = 512

resizeMipmap = false

useNextPowerOfTwo = true

filterType = 4


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; igConvertImage
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[OPTIMIZATION3]

name = igConvertImage

format = IG_GFX_TEXTURE_FORMAT_RGBA_DXT1

sourceFormat = invalid

order = IG_GFX_IMAGE_ORDER_DX

isExclude = exclude

convertIfSmaller = false

imageListFilename = 
